name: Build docker images

on:
  push:
    branches:
      - '20[0-9][0-9].[0-9]'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      # Same as build.sh: one image per folder
      - id: list
        run: echo "images=$(find * -maxdepth 0 -type d | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
    # Only publish from release branches, never from pull requests
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref_type == 'branch' }}
    steps:
      - uses: actions/checkout@v4

      # Tag with the release (branch name) and the release with the short sha,
      # e.g. 2026.2 and 2026.2-0e20d52
      - name: Compute tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openstack-${{ matrix.image }}"
          TAGS="$IMAGE:${GITHUB_SHA::7}"
          if [ "$PUSH" = "true" ]; then
              TAGS="$IMAGE:$GITHUB_REF_NAME,$IMAGE:$GITHUB_REF_NAME-${GITHUB_SHA::7}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          # Link the package to this repo on ghcr.io
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
