name: Build docker images

on:
  push:
    branches:
      - '20[0-9][0-9].[0-9]'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same as build.sh: one image per folder.
      # Only the folders that changed are built, except that everything is built
      # on manual runs, when the CI itself changed, or when the previous commit
      # is unknown (new branch, force push)
      - id: list
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          ALL=$(find * -maxdepth 0 -type d)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              IMAGES=$ALL
          else
              CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
              if grep -qE '^(\.github/|upstream-ref\.sh$)' <<< "$CHANGED"; then
                  IMAGES=$ALL
              else
                  IMAGES=$(grep -oE '^[^/]+/' <<< "$CHANGED" | tr -d / | sort -u | grep -Fx -f <(echo "$ALL") || true)
              fi
          fi
          echo "images=$(jq -R 'select(length > 0)' <<< "$IMAGES" | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    if: needs.list.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
    # Only publish from release branches, never from pull requests
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref_type == 'branch' }}
    steps:
      - uses: actions/checkout@v4

      # Tag with the release (branch name) and the release with the short sha,
      # e.g. 2026.2 and 2026.2-0e20d52
      - name: Compute tags
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openstack-${{ matrix.image }}"
          TAGS="$IMAGE:${GITHUB_SHA::7}"
          if [ "$PUSH" = "true" ]; then
              TAGS="$IMAGE:$GITHUB_REF_NAME,$IMAGE:$GITHUB_REF_NAME-${GITHUB_SHA::7}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # Cache key for the upstream sources, see upstream-ref.sh
      - name: Resolve upstream sources
        id: upstream
        run: echo "ref=$(./upstream-ref.sh ${{ matrix.image }})" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: UPSTREAM_REF=${{ steps.upstream.outputs.ref }}
          # Link the package to this repo on ghcr.io
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
